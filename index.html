<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фанты — Проверка Фона</title>

    <style>
        /* Черный фон для всей страницы */
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: #000000;
        }
        
        /* Игровой контейнер 9:16 строго по центру */
        .game-container {
            margin: 0 auto;
            width: 100%;
            height: 100%;
            aspect-ratio: 9/16;
            max-width: 100vh; /* Защита от растягивания на ПК */
            
            /* Подключаем наш фон */
            background-image: url('images/main_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1); /* Легкое свечение границ для проверки */
            position: relative;
        }
    </style>
</head>
<body>

    <div class="game-container"></div>

</body>
</html>
