<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Тест Нового Репозитория</title>

    <style>
        /* Черный фон страницы */
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        
        /* Временный яркий контейнер вместо фона, чтобы проверить работу сайта */
        .game-container {
            width: 100%;
            height: 100%;
            aspect-ratio: 9/16;
            max-width: 100vh;
            
            /* Временный неоновый градиент для проверки */
            background: linear-gradient(135deg, #1d2671 0%, #c33764 100%);
            
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }

        h1 {
            color: #ffffff;
            font-size: 24px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>НОВЫЙ РЕПОЗИТОРИЙ РАБОТАЕТ! 🚀</h1>
    </div>

</body>
</html>
