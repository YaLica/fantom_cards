
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фанты для всей семьи</title>

    <style>
        /* Базовые настройки экрана */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер игры под пропорции смартфона */
        .game-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            position: relative;
            overflow: hidden;
            background: #222;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Экраны игры (Изначально все скрыты, кроме первого) */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        /* Подключение картинок фонов */
        #screen-cover { background-image: url('cover.png'), url('cover.jpg'); }
        #screen-rules { background-image: url('rules.png'), url('rules.jpg'); }
        #screen-game { background: radial-gradient(circle, #2c3e50, #0f171e); }

        /* Кнопки навигации «Далее» и «К игре» */
        .nav-btn {
            margin-bottom: 40px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 15px 45px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            border: 1px solid rgba(255,255,255,0.4);
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.2s;
        }
        .nav-btn:active {
            background: rgba(255, 255, 255, 0.5);
        }

        /* --- ИГРОВОЙ ЭКРАН --- */
        .game-sub-view {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .game-sub-view.active {
            display: flex;
        }

        /* Колода на старте */
        .main-deck {
            width: 160px;
            height: 240px;
            background-image: url('card_back.png'), url('card_back.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        /* Кнопки-картинки */
        .game-btn {
            cursor: pointer;
            border: none;
            background: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            outline: none;
        }
        .game-btn:active { transform: scale(0.95); }

        .btn-start {
            width: 220px;
            height: 70px;
            background-image: url('btn_start.png'), url('btn_start.jpg');
        }

        /* Сетка карт 5х5 */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            aspect-ratio: 1/1;
            padding: 5px;
        }

        .card-slot {
            width: 100%;
            height: 100%;
            aspect-ratio: 1/1.4; /* Пропорции карты */
            background-image: url('card_back.png'), url('card_back.jpg');
            background-size: cover;
            background-position: center;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            cursor: pointer;
        }

        .card-slot.is-open {
            box-shadow: none;
            opacity: 0.8;
        }

        .btn-mix {
            width: 180px;
            height: 60px;
            background-image: url('btn_mix.png'), url('btn_mix.jpg');
            margin-top: 25px;
        }

        /* Поп-ап открытой карты */
        .overlay-card-view {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .overlay-card-view.active {
            display: flex;
        }

        .big-card {
            width: 260px;
            height: 390px;
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .btn-ready {
            width: 160px;
            height: 55px;
            background-image: url('btn_ready.png'), url('btn_ready.jpg');
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="game-container">
        
        <div class="screen active" id="screen-cover">
            <div></div> <button class="nav-btn" id="btn-to-rules">Далее 👉</button>
        </div>

        <div class="screen" id="screen-rules">
            <div></div>
            <button class="nav-btn" id="btn-to-game">К игре 👉</button>
        </div>

        <div class="screen" id="screen-game">
            
            <div class="game-sub-view active" id="view-deck">
                <div class="main-deck"></div>
                <button class="game-btn btn-start" id="btnStart"></button>
            </div>

            <div class="game-sub-view" id="view-grid">
                <div class="grid-container" id="gridContainer"></div>
                <button class="game-btn btn-mix" id="btnMix"></button>
            </div>

            <div class="overlay-card-view" id="view-overlay">
                <div class="big-card" id="bigCardPhoto"></div>
                <button class="game-btn btn-ready" id="btnReady"></button>
            </div>

        </div>

    </div>

    <audio id="sndStart" src="start.mp3" preload="auto"></audio>
    <audio id="sndOpen" src="card_open.mp3" preload="auto"></audio>
    <audio id="sndClose" src="card_close.mp3" preload="auto"></audio>
    <audio id="sndShuffle" src="shuffle.mp3" preload="auto"></audio>
