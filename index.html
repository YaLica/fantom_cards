<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фанты — Проверка фона</title>

    <style>
        /* Черный фон страницы */
        html, body {
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        /* Игровой контейнер 9:16 строго по центру */
        .game-container {
            width: 100%;
            height: 100%;
            aspect-ratio: 9/16;
            max-width: 100vh;
            
            /* Пробуем подключить твой фон с учетом папки fantom_cards */
            background-image: url('fantom_cards/images/main_bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

    <div class="game-container"></div>

</body>
</html>
