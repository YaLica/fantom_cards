<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Фанты для всей семьи</title>

    <meta property="og:type" content="website">
    <meta property="og:title" content="🎯 Игра Фанты 🚀">
    <meta property="og:description" content="👉 НАЖИМАЙ И ИГРАЙ! 🚀">
    <meta property="og:image" content="cover.png">
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1920">

    <style>
        /* Обнуление стилей и запрет выделения (Часть 3: Анти-угон) */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            -webkit-touch-callout: none; /* Запрет долгого тапа на iOS */
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ограничитель игрового поля под пропорции 9:16 */
        .game-container {
            width: 100%;
            height: 100%;
            max-width: 56.25vh; /* 9/16 от высоты */
            max-height: 177.78vw; /* 16/9 от ширины */
            position: relative;
            overflow: hidden;
            background: #222;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }

        /* Главная Карусель */
        .swiper-wrapper {
            display: flex;
            width: 300%;
            height: 100%;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .slide {
            width: 33.333%;
            height: 100%;
            position: relative;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Назначение фонов экранов 1 и 2 */
        #slide-cover { background-image: url('cover.png'); }
        #slide-rules { background-image: url('rules.png'); }
        #slide-game { 
            background: radial-gradient(circle, #2c3e50, #0f171e); 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10px;
        }

        /* Пульсирующая плашка «листай влево» */
        .swipe-hint {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            pointer-events: none;
            animation: pulseHint 1.5s infinite alternate;
            z-index: 10;
        }

        @keyframes pulseHint {
            0% { transform: scale(0.95); opacity: 0.6; }
            100% { transform: scale(1.05); opacity: 1; box-shadow: 0 0 10px rgba(255,255,255,0.4); }
        }

        /* --- ИГРОВОЕ ПОЛЕ --- */
        
        /* Сцена «Большая колода» */
        .deck-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
            transition: opacity 0.5s ease, pointer-events 0.5s ease;
        }

        .main-deck {
            width: 160px;
            height: 240px;
            background-image: url('card_back.png');
            background-size: cover;
            background-position: center;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: 30px;
        }

        /* Универсальный класс анимации кнопок */
        .btn {
            cursor: pointer;
            border: none;
            background: none;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            transition: transform 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }
        .btn:active { transform: scale(0.9); }

        .btn-start {
            width: 220px;
            height: 70px;
            background-image: url('btn_start.png');
            animation: floatBtn 2s infinite ease-in-out;
        }

        @keyframes floatBtn {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* Игровая Сетка 5х5 */
        .grid-scene {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 6px;
            width: 100%;
            aspect-ratio: 1/1;
            max-height: 60vh;
            padding: 5px;
            perspective: 1000px; /* Для 3D переворотов */
        }

        /* Карточка в сетке */
        .card-slot {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            background-size: cover;
            background-position: center;
        }

        .card-front {
            background-image: url('card_back.png');
        }

        .card-back {
            transform: rotateY(180deg);
        }

        /* Состояние перевернутой карты в сетке */
        .card-slot.is-open {
            transform: rotateY(180deg);
        }

        /* Пульсирующая подсказка «НАЖМИ НА ЛЮБУЮ КАРТУ» */
        .tap-hint {
            color: #fff;
            font-size: 18px;
            font-weight: 900;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 1px;
            animation: pulseText 1.2s infinite alternate;
            transition: opacity 0.5s ease;
        }

        @keyframes pulseText {
            0% { opacity: 0.4; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1.05); }
        }

        .btn-mix {
            width: 180px;
            height: 60px;
            background-image: url('btn_mix.png');
            margin-top: 15px;
        }

        /* Сцена «Взлёт фанта» (Активная парящая карта) */
        .overlay-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.75);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            perspective: 1200px;
        }

        .overlay-scene.active {
            opacity: 1;
            pointer-events: auto;
        }

        .flying-card {
            width: 240px;
            height: 360px;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform: scale(0.2) rotateY(0deg);
        }

        .flying-card.zoomed {
            transform: scale(1) rotateY(180deg);
        }

        .fly-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            background-size: cover;
            background-position: center;
        }

        .fly-front {
            background-image: url('card_back.png');
        }

        .fly-back {
            transform: rotateY(180deg);
        }

        .btn-ready {
            width: 160px;
            height: 55px;
            background-image: url('btn_ready.png');
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .btn-ready.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Встряхивание при перемешивании */
        @keyframes shakeGrid {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-8px, 5px); }
            40% { transform: translate(6px, -6px); }
            60% { transform: translate(-5px, 4px); }
            80% { transform: translate(4px, -3px); }
            100% { transform: translate(0, 0); }
        }

        .shake {
            animation: shakeGrid 0.4s ease-in-out;
        }

        /* Полный запрет перетаскивания картинок */
        img {
            pointer-events: none;
            -webkit-user-drag: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="swiper-wrapper" id="mainSwiper">
            
            <div class="slide" id="slide-cover">
                <div class="swipe-hint">листай влево</div>
            </div>

            <div class="slide" id="slide-rules">
                <div class="swipe-hint">листай влево</div>
            </div>

            <div class="slide" id="slide-game">
                
                <div class="deck-scene" id="deckScene">
                    <div class="main-deck"></div>
                    <button class="btn btn-start" id="btnStart"></button>
                </div>

                <div class="grid-scene" id="gridScene">
                    <div class="tap-hint" id="tapHint">НАЖМИ НА ЛЮБУЮ КАРТУ</div>
                    <div class="grid-container" id="gridContainer"></div>
                    <button class="btn btn-mix" id="btnMix"></button>
                </div>

                <div class="overlay-scene" id="overlayScene">
                    <div class="flying-card" id="flyingCard">
                        <div class="fly-face fly-front"></div>
                        <div class="fly-face fly-back" id="flyBackFace"></div>
                    </div>
                    <button class="btn btn-ready" id="btnReady"></button>
                </div>

            </div>
        </div>
    </div>

    <audio id="sndStart" src="start.mp3" preload="auto"></audio>
    <audio id="sndOpen" src="card_open.mp3" preload="auto"></audio>
    <audio id="sndClose" src="card_close.mp3" preload="auto"></audio>
    <audio id="sndShuffle" src="shuffle.mp3" preload="auto"></audio>

    <script>
        // --- ЧАСТЬ 1: Карусель-Свайпер ---
        const swiper = document.getElementById('mainSwiper');
        let currentSlide = 0;
        let startX = 0;
        let isDragging = false;

        // Обработка жестов свайпа
        window.addEventListener('touchstart', (e) => {
            startX = e.touches[0].clientX;
            isDragging = true;
        }, { passive: true });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            let diffX = startX - e.touches[0].clientX;

            // Если мы на Игровом Поле (Экран №3), блокируем свайп вперед (влево)
            if (currentSlide === 2 && diffX > 0) {
                isDragging = false;
                return;
            }
        }, { passive: true });

        window.addEventListener('touchend', (e) => {
            if (!isDragging) return;
            isDragging = false;
            let diffX = startX - e.changedTouches[0].clientX;

            if (Math.abs(diffX) > 50) { // Чувствительность свайпа
                if (diffX > 0 && currentSlide < 2) {
                    currentSlide++; // Листаем вперед
                } else if (diffX < 0 && currentSlide > 0) {
                    currentSlide--; // Свободно возвращаемся назад
                }
                updateSwiper();
            }
        });

        function updateSwiper() {
            swiper.style.transform = `translateX(-${currentSlide * 33.333}%)`;
        }

        // --- ЧАСТЬ 2: Механика игрового процесса ---
        const deckScene = document.getElementById('deckScene');
        const gridScene = document.getElementById('gridScene');
        const gridContainer = document.getElementById('gridContainer');
        const overlayScene = document.getElementById('overlayScene');
        const flyingCard = document.getElementById('flyingCard');
        const flyBackFace = document.getElementById('flyBackFace');
        const btnReady = document.getElementById('btnReady');
        const tapHint = document.getElementById('tapHint');

        // База данных карт (индексы от 1 до 25)
        let cardsData = Array.from({ length: 25 }, (_, i) => i + 1);
        let openedCards = new Set(); // Здесь храним индексы открытых карт
        let lastClickedSlot = null;

        // Кнопка НАЧИНАЕМ
        document.getElementById('btnStart').addEventListener('click', () => {
            document.getElementById('sndStart').play();
            deckScene.style.opacity = '0';
            deckScene.style.pointerEvents = 'none';
            
            // Генерируем сетку и показываем поле
            buildGrid();
            gridScene.style.opacity = '1';
            gridScene.style.pointerEvents = 'auto';

            // Самоликвидирующаяся подсказка через 3 секунды
            setTimeout(() => {
                tapHint.style.opacity = '0';
                setTimeout(() => tapHint.remove(), 500);
            }, 3000);
        });

        // Сборка сетки 5х5
        function buildGrid() {
            gridContainer.innerHTML = '';
            cardsData.forEach((cardId, index) => {
                const slot = document.createElement('div');
                slot.className = 'card-slot';
                slot.dataset.id = cardId;
                slot.dataset.index = index;

                // Если карта числится открытой (после закрытия оверлея)
                if (openedCards.has(cardId)) {
                    slot.classList.add('is-open');
                }

                slot.innerHTML = `
                    <div class="card-face card-front"></div>
                    <div class="card-face card-back" style="background-image: url('card_${cardId}.png')"></div>
                `;

                // Клик по карте в сетке (Взлет Фанта)
                slot.addEventListener('click', () => {
                    if (openedCards.has(cardId)) return; // Уже выполненные фанты не трогаем
                    launchFant(slot, cardId);
                });

                gridContainer.appendChild(slot);
            });
        }

        // Взлет Фанта
        function launchFant(slot, cardId) {
            lastClickedSlot = slot;
            document.getElementById('sndOpen').play();

            // Рендерим крупную карту в оверлее лицом к игроку
            flyBackFace.style.background-image = `url('card_${cardId}.png')`;
            overlayScene.classList.add('active');

            // Запускаем 3D-анимацию взлета
            setTimeout(() => {
                flyingCard.classList.add('zoomed');
                setTimeout(() => {
                    btnReady.classList.add('show');
                }, 400);
            }, 50);
        }

        // Посадка на место (Кнопка ГОТОВО!)
        btnReady.addEventListener('click', () => {
            document.getElementById('sndClose').play();
            btnReady.classList.remove('show');
            flyingCard.classList.remove('zoomed');

            // Ждем завершения анимации уменьшения карты
            setTimeout(() => {
                overlayScene.classList.remove('active');
                
                if (lastClickedSlot) {
                    const id = parseInt(lastClickedSlot.dataset.id);
                    openedCards.add(id); // Запоминаем, что карта вскрыта
                    lastClickedSlot.classList.add('is-open'); // Переворачиваем в сетке лицом
                }
            }, 500);
        });

        // Космический Рандом (Кнопка ПЕРЕМЕШАТЬ)
        document.getElementById('btnMix').addEventListener('click', () => {
            document.getElementById('sndShuffle').play();
            
            // Эффект встряхивания сетки
            gridContainer.classList.add('shake');
            setTimeout(() => gridContainer.classList.remove('shake'), 400);

            // Полное обнуление логики
            openedCards.clear(); 
            
            // Тасование Фишера-Йетса для абсолютного рандома
            for (let i = cardsData.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cardsData[i], cardsData[j]] = [cardsData[j], cardsData[i]];
            }

            // Пересобираем сетку (все карты вернутся рубашкой вверх на новых позициях)
            buildGrid();
        });

        // --- ЧАСТЬ 3: Броня от воровства контента (Анти-угон) ---
        
        // 1. Блокировка контекстного меню (Запрет долгого тапа)
        window.addEventListener('contextmenu', (e) => e.preventDefault());

        // 2. Блокировка перетаскивания элементов (Drag & Drop)
        window.addEventListener('dragstart', (e) => e.preventDefault());

        // 3. Железобетонная защита от горячих клавиш разработчика (F12, Ctrl+Shift+I и т.д.)
        window.addEventListener('keydown', (e) => {
            if (
                e.key === 'F12' ||
                (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J')) ||
                (e.ctrlKey && e.key === 'U')
            ) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
